<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIN Checker</title>
<style>
:root{--bg:#f3f3f3;--line:#d6d6d6;--ink:#252423;--muted:#5f5f5f;--fc:#13239e;--ft:#11552f;--fr:#a3333d;--empty:#252423}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Roboto,sans-serif}[hidden]{display:none!important}
#loginView{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.08);padding:28px 26px}
.box h1{margin:0 0 4px;font-weight:400;font-size:24px;text-align:center}.box p{margin:0 0 22px;text-align:center;color:var(--muted);font-size:14px}
.box label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}.box input{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);font-family:inherit}
.btn{border:0;background:var(--fc);color:#fff;font-size:16px;font-family:inherit;cursor:pointer}.btn:disabled{opacity:.6}.box .btn{width:100%;margin-top:22px;padding:11px}
.err{margin-top:14px;padding:9px 12px;background:#fbeaec;color:var(--fr);font-size:14px}
.topbar{background:#263445;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:16px;font-variant-numeric:tabular-nums}
.clock{font-size:15px;white-space:nowrap}.divider{width:1px;align-self:stretch;background:rgba(255,255,255,.25)}
.user{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:#5b7088;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;border:2px solid rgba(255,255,255,.35)}
.who{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timer{font-size:13px;color:#b9c4cf;white-space:nowrap}.timer.warn{color:#ff9aa5;font-weight:600}
.topbar a{color:#dfe7ef;text-decoration:underline;cursor:pointer;font-size:15px}
main{max-width:820px;margin:0 auto;padding:16px}.search{display:flex;gap:8px;margin-bottom:6px}
.search input{flex:1;min-width:0;padding:11px 14px;font-size:18px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);font-family:inherit}.search .btn{padding:0 22px}
.hint,.dataper{font-size:12px;color:var(--muted);margin:0 0 10px}.msg{padding:12px 14px;background:#fff;border:1px solid var(--line);margin-bottom:14px}.msg.err{background:#fbeaec;color:var(--fr)}
.panel{background:#fff;border:1px solid var(--line);padding:20px}.frame-no{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.row3{display:grid;grid-template-columns:2.2fr 1fr 1fr;gap:22px;margin-bottom:22px}.tile{border:1px solid var(--line);box-shadow:2px 2px 4px rgba(0,0,0,.12);text-align:center;padding:10px 8px 14px}
.lbl{font-size:19px;font-weight:300;text-transform:uppercase}.val{font-size:16px;font-weight:600;margin-top:12px;min-height:1.2em}
.sec{border:1px solid var(--line);padding:6px;margin-bottom:22px}.sec:last-child{margin:0}.bar{color:#fff;text-align:center;font-size:18px;padding:3px 0}
.fc .bar{background:var(--fc)}.ft .bar{background:var(--ft)}.fr .bar{background:var(--fr)}
.cells{display:grid;grid-template-columns:1fr .85fr 2fr;gap:20px;margin-top:6px}.cell{border:1px solid var(--line);text-align:center;padding:6px 6px 10px;min-height:70px}.cell .val{margin-top:8px}
.none .cell{background:var(--empty);border-color:var(--empty);position:relative}.none .cell>*{visibility:hidden}
.none .wide::after{content:"Belum pernah dilakukan";position:absolute;inset:0;display:grid;place-items:center;color:#8a8886;font-size:14px}
@media(max-width:600px){
 .topbar{padding:8px 10px;gap:10px}.clock{font-size:12px;line-height:1.25}.clock .sep{display:none}.clock .t{display:block;font-size:14px;font-weight:600}
 .avatar{width:30px;height:30px;font-size:12px}.who,.topbar a{font-size:12.5px}.timer{font-size:11px}
 main{padding:10px}.search input{padding:9px 10px;font-size:16px;letter-spacing:.05em}.search .btn{padding:0 16px;font-size:15px}.hint{display:none}.dataper{font-size:11px;margin-bottom:8px}
 .panel{padding:8px}.frame-no{margin:0 0 6px;font-size:11px}.row3{grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.row3 .tile:first-child{grid-column:1/-1}
 .tile{padding:5px 6px 7px;box-shadow:none}.lbl{font-size:10.5px;font-weight:400;color:var(--muted)}.val{font-size:14px;margin-top:2px}
 .sec{padding:4px;margin-bottom:8px}.bar{font-size:13px;padding:2px 0}.cells{grid-template-columns:1fr .8fr 1.6fr;gap:4px;margin-top:4px}
 .cell{min-height:0;padding:4px 3px 6px}.cell .val{margin-top:2px;font-size:13px}.none .wide::after{font-size:11px}}
</style></head><body>
<section id="loginView"><form class="box" id="loginForm">
  <h1>VIN Checker</h1><p>Masuk dengan akun MD Anda</p>
  <label for="u">USERNAME</label><input id="u" autocomplete="username" required autofocus>
  <label for="p">PASSWORD</label><input id="p" type="password" autocomplete="current-password" required>
  <button class="btn" id="loginBtn">Masuk</button><div class="err" id="loginErr" hidden></div>
</form></section>
<section id="appView" hidden>
  <div class="topbar"><div class="clock" id="clock"></div><div class="divider"></div>
    <div class="user"><div class="avatar" id="avatar" hidden></div><div style="min-width:0"><div class="who" id="who"></div><div class="timer" id="timer"></div></div></div>
    <a id="logoutBtn">Keluar</a></div>
  <main><form class="search" id="searchForm"><input id="q" placeholder="Nomor VIN (17 karakter)" maxlength="17" autocomplete="off"><button class="btn" id="searchBtn">Cek</button></form>
    <p class="hint">Masukkan nomor VIN 17 karakter.</p><div class="dataper" id="dataPer"></div><div id="out"></div></main>
</section>
<script>
// ====== GANTI dengan Web app URL dari Apps Script (Deploy → Manage deployments), harus berakhiran /exec ======
const API_URL = 'https://script.google.com/macros/s/AKfycbxlDNEW1C3bvfWVjhzyr5kdaQN0miq0NOZZxo1lVqiIDh41_UnBTB0mWbD-fGm_i4j7/exec';
// ===================================================================================================

async function api(body) {
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL)) throw new Error('API_URL belum diisi');
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const $ = (s) => document.querySelector(s), pad = (n) => String(n).padStart(2, '0');
const esc = (v) => String(v == null ? '-' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
let token = null, profile = {};
try { token = sessionStorage.getItem('vinToken'); profile = JSON.parse(sessionStorage.getItem('vinProfile') || '{}'); } catch (e) {}
function saveSession(t, p) {
  token = t; profile = p || {};
  try { if (t) { sessionStorage.setItem('vinToken', t); sessionStorage.setItem('vinProfile', JSON.stringify(profile)); } else sessionStorage.clear(); } catch (e) {}
}
const sesiMs = () => (profile.sesiDetik || 60) * 1000;
function resetTimer() { profile.expiresAt = Date.now() + sesiMs(); saveSession(token, profile); }
function keluar(pesan) { if (token) api({ action: 'logout', token }).catch(() => {}); saveSession(null); showLogin(pesan); }
function tick() {
  const d = new Date();
  $('#clock').innerHTML = `<span>${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}</span><span class="sep"> · </span><span class="t">${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}</span>`;
  if (!token || !profile.expiresAt) return;
  const sisa = Math.max(0, Math.ceil((profile.expiresAt - Date.now()) / 1000));
  $('#timer').textContent = `Logout otomatis dalam ${Math.floor(sisa / 60)}:${pad(sisa % 60)}`;
  $('#timer').classList.toggle('warn', sisa <= Math.min(60, sesiMs() / 4000));
  if (sisa === 0) keluar(`Anda keluar otomatis karena tidak ada pencarian selama ${Math.round(sesiMs() / 60000)} menit.`);
}
setInterval(tick, 1000);
function showApp() {
  $('#loginView').hidden = true; $('#appView').hidden = false;
  const nama = profile.nama || '', k = nama.replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/).filter(Boolean);
  $('#who').textContent = 'Masuk sebagai ' + nama;
  $('#avatar').textContent = (k.length > 1 ? k[0][0] + k[1][0] : (k[0] || '?').slice(0, 2)).toUpperCase();
  $('#dataPer').textContent = profile.dataPer ? 'Data per ' + profile.dataPer : '';
  $('#q').focus(); tick();
}
function showLogin(pesan) {
  $('#appView').hidden = true; $('#loginView').hidden = false; $('#out').innerHTML = '';
  $('#loginErr').hidden = !pesan; $('#loginErr').textContent = pesan || '';
}
$('#loginForm').onsubmit = (e) => {
  e.preventDefault(); const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'Memeriksa…';
  api({ action: 'login', username: $('#u').value, password: $('#p').value }).then((r) => {
    btn.disabled = false; btn.textContent = 'Masuk';
    if (!r.ok) return showLogin(r.error);
    $('#p').value = ''; saveSession(r.token, { nama: r.nama, dataPer: r.dataPer, sesiDetik: r.sesiDetik || 60 }); resetTimer(); showApp();
  }).catch(() => { btn.disabled = false; btn.textContent = 'Masuk'; showLogin('Gagal terhubung ke server. Coba lagi.'); });
};
$('#logoutBtn').onclick = () => keluar();
function card(x) {
  const sec = (k, judul) => {
    const a = x[k] || { done: false }, c = (l, v, w) => `<div class="cell ${w || ''}"><div class="lbl">${l}</div><div class="val">${esc(v)}</div></div>`;
    return `<div class="sec ${k} ${a.done ? '' : 'none'}"><div class="bar">${judul}</div><div class="cells">${c('Main Dealer', a.main_dealer)}${c('Dealer', a.dealer)}${c('Tanggal', a.tanggal, 'wide')}</div></div>`;
  };
  const tile = (l, v) => `<div class="tile"><div class="lbl">${l}</div><div class="val">${esc(v)}</div></div>`;
  return `<div class="panel"><div class="frame-no">No. VIN: ${esc(x.no_frame)}</div><div class="row3">${tile('Sales', x.sales)}${tile('Model', x.model)}${tile('Prod. Year', x.tahun)}</div>`
    + sec('fc', 'Frame Check') + sec('ft', 'Frame Treatment') + sec('fr', 'Frame Replacement') + '</div>';
}
$('#searchForm').onsubmit = (e) => {
  e.preventDefault(); const q = $('#q').value.trim(), out = $('#out'), btn = $('#searchBtn');
  btn.disabled = true; out.innerHTML = '<div class="msg">Mencari…</div>';
  api({ action: 'search', token, vin: q, sumber: 'github' }).then((d) => {
    btn.disabled = false;
    if (d.auth === false) { saveSession(null); return showLogin(d.error); }
    resetTimer();
    if (!d.ok) out.innerHTML = `<div class="msg err">${esc(d.error)}</div>`;
    else if (d.tooMany) out.innerHTML = `<div class="msg">${esc(d.message)}</div>`;
    else if (!d.results.length) out.innerHTML = '<div class="msg">Tidak Ditemukan</div>';
    else out.innerHTML = card(d.results[0]);
  }).catch(() => { btn.disabled = false; out.innerHTML = '<div class="msg err">Gagal terhubung ke server. Coba lagi.</div>'; });
};
if (token && profile.expiresAt > Date.now()) showApp(); else { saveSession(null); showLogin(); }
</script></body></html>
